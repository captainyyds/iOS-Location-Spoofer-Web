server {
    listen 80;
    listen [::]:80;
    server_name gps.x-cipher.com;
    root /www/wwwroot/gps.x-cipher.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://gps.x-cipher.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gps.x-cipher.com;
    ssl_certificate /www/server/panel/vhost/cert/gps.x-cipher.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/gps.x-cipher.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    access_log off;
    # Shadowrocket includes the token in URLs. Keep it out of request/error logs.
    error_log /var/log/nginx-gps-error.log crit;
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host gps.x-cipher.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
