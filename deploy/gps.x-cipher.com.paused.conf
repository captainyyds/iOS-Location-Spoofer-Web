server {
    listen 80;
    listen [::]:80;
    server_name gps.x-cipher.com;
    root /www/wwwroot/gps.x-cipher.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://gps.x-cipher.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gps.x-cipher.com;
    ssl_certificate /www/server/panel/vhost/cert/gps.x-cipher.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/gps.x-cipher.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    error_log /var/log/nginx-gps-error.log crit;
    charset utf-8;
    default_type text/plain;
    location / { return 503 "GPS service is paused.\n"; }
}
